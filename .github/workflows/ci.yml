name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        cache: true

    - name: Restore dependencies
      run: dotnet restore src/Ampla.LogReader.sln

    - name: Verify formatting
      run: dotnet format src/Ampla.LogReader.sln --verify-no-changes

    - name: Build project
      run: dotnet build src/Ampla.LogReader.sln --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test src/Ampla.LogReader.sln --no-build --configuration Release --verbosity normal
